title: Telco Metrics + ML on Elastic Serverless
teaser: Hands-on lab for CSPs — explore OpenTelemetry metrics, ML anomalies, and automated
  remediation on Elastic Serverless.
description: |
  Telecom operators live and die by service quality. When core signaling latency spikes or a metro link degrades,
  the difference between a quiet night and a P1 outage is how fast you detect, explain, and remediate.

  In this workshop you will use **Elastic Serverless Observability** to:

  - Connect a live Telco NOC demo that streams real OpenTelemetry logs, metrics, and traces
  - Explore network and service **metrics** with ES|QL
  - Investigate **machine learning** anomalies that surface degradation before customer tickets spike
  - Follow the path from alert signal to **workflow** remediation

  Built for pre-sales and enablement conversations with telco customers (metrics, ML, Kubernetes/OTel migration).
  No prior Elastic experience required. Each challenge builds on the last (~10–15 minutes).
